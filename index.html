<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090c" />
    <meta
      name="description"
      content="Point your phone at sheet music and hear it played. Pia reads printed piano music in the browser — no upload, no account."
    />
    <title>Pia — scan sheet music, hear it play</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fbbf24'/%3E%3Crect x='7' y='9' width='4' height='15' rx='1' fill='%23181c24'/%3E%3Crect x='14' y='9' width='4' height='15' rx='1' fill='%23181c24'/%3E%3Crect x='21' y='9' width='4' height='15' rx='1' fill='%23181c24'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registered after load so it never competes with the first paint.
      if ('serviceWorker' in navigator) {
        addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
